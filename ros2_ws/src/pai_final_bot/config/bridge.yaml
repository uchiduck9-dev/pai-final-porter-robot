# ROS 2 <-> Ignition Gazebo のトピック対応
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /cmd_vel
  gz_topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /odom
  gz_topic_name: /odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /scan
  gz_topic_name: /scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: ignition.msgs.LaserScan
  direction: GZ_TO_ROS

# 段階3: スーツケースの固定／解除（ロボットの DetachableJoint へ指示を送る）
- ros_topic_name: /porter/attach
  gz_topic_name: /porter/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: ignition.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /porter/detach
  gz_topic_name: /porter/detach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: ignition.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /porter/attach_state
  gz_topic_name: /porter/attach_state
  ros_type_name: std_msgs/msg/String
  gz_type_name: ignition.msgs.StringMsg
  direction: GZ_TO_ROS

- ros_topic_name: /camera/image_raw
  gz_topic_name: /camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
